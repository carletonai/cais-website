<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CAIS - Page Not Found - Tests</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <script>
      sessionStorage.redirect = location.href;
      var repoBase = "/cais-website/";
      var redirectBase =
        location.pathname.indexOf(repoBase) === 0 ? repoBase : "/";
      location.replace(redirectBase);
    </script>
  </head>
  <body>
    Redirecting to homepage...
  </body>
</html>
