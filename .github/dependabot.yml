# Dependabot configuration:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before proposing a new release, so a hijacked publish has time to be
    # caught and pulled. Security updates are never delayed by this.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Lint, typecheck and test tooling: CI exercises all of it, so these can
      # land together. UI and build dependencies (React, Radix, Tailwind, Vite,
      # framer-motion, ...) stay as separate PRs so each can be checked in a
      # browser.
      dev-tooling:
        patterns:
          - "@babel/*"
          - "@eslint/*"
          - "@testing-library/*"
          - "@types/*"
          - "@typescript-eslint/*"
          - "babel-jest"
          - "eslint"
          - "eslint-plugin-*"
          - "jest"
          - "jest-environment-jsdom"
          - "prettier"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
