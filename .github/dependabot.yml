# Dependabot configuration:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before proposing a new release, so a hijacked publish has time to be
    # caught and pulled. Security updates are never delayed by this.
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # typescript-eslint 8 declares a peer range of typescript <6.1 and stops
      # with "does not support TS 7.0" under TypeScript 7 (#82). Its TypeScript 7
      # support is aimed at 7.1; drop this once a typescript-eslint release
      # supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Lint, typecheck and test tooling: CI exercises all of it, so these can
      # land together. UI and build dependencies (React, Radix, Tailwind, Vite,
      # framer-motion, ...) stay as separate PRs so each can be checked in a
      # browser.
      dev-tooling:
        patterns:
          - "@babel/*"
          - "@eslint/*"
          - "@testing-library/*"
          - "@types/*"
          - "@typescript-eslint/*"
          - "babel-jest"
          - "eslint"
          - "eslint-plugin-*"
          - "jest"
          - "jest-environment-jsdom"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
      # react and react-dom refuse to run at different versions, so a bump of
      # one alone fails every test; they move together.
      react:
        patterns:
          - "react"
          - "react-dom"
      # The Babel presets need the @babel/core of the same major: a preset
      # bumped to 8 under core 7 loads as nothing and strips no TypeScript.
      # Majors included, since the dev-tooling group above takes only
      # minors and patches.
      babel:
        patterns:
          - "@babel/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
